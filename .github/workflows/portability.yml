name: portability

on:
  workflow_dispatch:
  push:
    branches: [master, ci/openbsd-netbsd]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/ci/**'
      - 'poshli.sh'
      - 'Makefile'
      - '.github/workflows/portability.yml'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Record environment
        run: |
          set -e
          sw_vers
          uname -a
          /usr/bin/make --version | sed -n '1p'
          /bin/sh -c 'echo "sh BASH_VERSION=${BASH_VERSION:-none}"'
          awk --version 2>&1 || true
          command -v awk od wc
          id -u
          locale
          locale -a | grep -i 'utf' || true

      - name: Verify toolchain
        run: |
          set -e
          /bin/sh -c 'case "${BASH_VERSION:-none}" in 3.2.*) ;; *) echo "expected bash 3.2 for /bin/sh, got ${BASH_VERSION:-none}" >&2; exit 1 ;; esac'
          awk --version 2>&1 | grep -q 'awk version' || {
            echo 'expected BWK awk (one true awk)' >&2
            exit 1
          }
          /usr/bin/make --version | grep -q 'GNU Make' || {
            echo 'expected GNU make' >&2
            exit 1
          }

      - name: Verify bundle is synchronized with src/
        run: /usr/bin/make check-bundle

      - name: Sources with /bin/sh and BWK awk
        run: sh tools/ci/portability_run.sh "sources, /bin/sh, BWK awk" /usr/bin/make test POSHLI_TEST_SHELL=/bin/sh

      - name: Bundle with /bin/sh and BWK awk
        run: sh tools/ci/portability_run.sh "bundle, /bin/sh, BWK awk" /usr/bin/make test-bundle POSHLI_TEST_SHELL=/bin/sh

      - name: Sources with bash --posix and BWK awk
        run: sh tools/ci/portability_run.sh "sources, bash --posix, BWK awk" /usr/bin/make test POSHLI_TEST_SHELL="/bin/bash --posix"

      - name: Bundle with bash --posix and BWK awk
        run: sh tools/ci/portability_run.sh "bundle, bash --posix, BWK awk" /usr/bin/make test-bundle POSHLI_TEST_SHELL="/bin/bash --posix"

  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Run FreeBSD validation
        uses: vmactions/freebsd-vm@v1.6.0
        with:
          release: "15.1"
          prepare: |
            set -e
            pkg install -y gmake bash
          run: |
            set -e
            uname -a
            freebsd-version
            gmake --version 2>&1 | sed -n '1p'
            awk --version 2>&1 || true
            bash --version 2>&1 | sed -n '1p'
            id -u
            locale
            locale -a | grep -i 'utf' || true
            uname -s | grep -qx FreeBSD
            /bin/sh -c 'test -z "${BASH_VERSION:-}"' || {
              echo 'expected FreeBSD sh for /bin/sh' >&2
              exit 1
            }
            awk --version 2>&1 | grep -q 'awk version' || {
              echo 'expected one true awk' >&2
              exit 1
            }
            bash --version 2>&1 | grep -q 'GNU bash' || {
              echo 'expected GNU bash' >&2
              exit 1
            }
            gmake --version 2>&1 | grep -q 'GNU Make' || {
              echo 'expected GNU make' >&2
              exit 1
            }
            gmake check-bundle
            sh tools/ci/portability_run.sh "sources, /bin/sh, one true awk" \
              gmake test POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "bundle, /bin/sh, one true awk" \
              gmake test-bundle POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "sources, bash --posix, one true awk" \
              gmake test POSHLI_TEST_SHELL="bash --posix"
            sh tools/ci/portability_run.sh "bundle, bash --posix, one true awk" \
              gmake test-bundle POSHLI_TEST_SHELL="bash --posix"

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run OpenBSD 8.0 validation
        uses: vmactions/openbsd-vm@v1.4.9
        with:
          release: "8.0"
          cache-after-prepare: true
          prepare: |
            set -e
            pkg_add -I gmake bash
          run: |
            set -e
            export PATH="/usr/local/bin:$PATH"
            uname -a
            sysctl kern.version
            id -u
            locale
            locale -a | grep -i 'utf' || true

            _env="release=$(uname -r) arch=$(uname -m) uid=$(id -u) sh=$(/bin/sh -c 'printf "%s" "${KSH_VERSION:-system-sh}"') awk=$(awk -V 2>&1 | sed -n '1p') bash=$(bash --version | sed -n '1p') make=$(gmake --version | sed -n '1p') locales=$(locale -a | tr '\n' ',')"
            printf '::notice title=OpenBSD toolchain::%s\n' "$_env"

            uname -s | grep -qx OpenBSD
            # OpenBSD's /bin/sh is its ksh, but this build does not export
            # KSH_VERSION to a non-interactive "sh -c". Prove only what is
            # portable: the system shell is not bash. The suite itself is the
            # real portability test.
            /bin/sh -c 'test -z "${BASH_VERSION:-}"' || {
              echo 'expected a non-bash /bin/sh' >&2
              exit 1
            }
            awk -V 2>&1 | grep -qi 'awk version' || {
              echo 'expected BWK awk (one true awk)' >&2
              exit 1
            }
            bash --version 2>&1 | grep -q 'GNU bash' || {
              echo 'expected GNU bash' >&2
              exit 1
            }
            gmake --version | grep -q 'GNU Make' || {
              echo 'expected GNU make' >&2
              exit 1
            }

            gmake check-bundle
            sh tools/ci/portability_run.sh "sources, /bin/sh, BWK awk" \
              gmake test POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "bundle, /bin/sh, BWK awk" \
              gmake test-bundle POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "sources, bash --posix, BWK awk" \
              gmake test POSHLI_TEST_SHELL="bash --posix"
            sh tools/ci/portability_run.sh "bundle, bash --posix, BWK awk" \
              gmake test-bundle POSHLI_TEST_SHELL="bash --posix"

  netbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Run NetBSD 11.1 validation
        uses: vmactions/netbsd-vm@v1.5.3
        with:
          release: "11.1"
          cache-after-prepare: true
          prepare: |
            set -e
            /usr/sbin/pkg_add -u gmake bash
          run: |
            set -e
            export PATH="/usr/pkg/bin:$PATH"
            uname -a
            id -u
            locale
            locale -a | grep -i 'utf' || true

            _env="release=$(uname -r) arch=$(uname -m) uid=$(id -u) sh=ash awk=$(awk -version 2>&1 | sed -n '1p') bash=$(bash --version | sed -n '1p') make=$(gmake --version | sed -n '1p') locales=$(locale -a | tr '\n' ',')"
            printf '::notice title=NetBSD toolchain::%s\n' "$_env"

            uname -s | grep -qx NetBSD
            /bin/sh -c 'test -z "${BASH_VERSION:-}"' || {
              echo 'expected a non-bash /bin/sh' >&2
              exit 1
            }
            /bin/sh -c 'test -z "${KSH_VERSION:-}"' || {
              echo 'expected NetBSD ash for /bin/sh' >&2
              exit 1
            }
            awk -version 2>&1 | grep -qi 'awk version' || {
              echo 'expected BWK awk (one true awk)' >&2
              exit 1
            }
            bash --version 2>&1 | grep -q 'GNU bash' || {
              echo 'expected GNU bash' >&2
              exit 1
            }
            gmake --version | grep -q 'GNU Make' || {
              echo 'expected GNU make' >&2
              exit 1
            }

            gmake check-bundle
            sh tools/ci/portability_run.sh "sources, /bin/sh, BWK awk" \
              gmake test POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "bundle, /bin/sh, BWK awk" \
              gmake test-bundle POSHLI_TEST_SHELL=/bin/sh
            sh tools/ci/portability_run.sh "sources, bash --posix, BWK awk" \
              gmake test POSHLI_TEST_SHELL="bash --posix"
            sh tools/ci/portability_run.sh "bundle, bash --posix, BWK awk" \
              gmake test-bundle POSHLI_TEST_SHELL="bash --posix"
