name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - dash
          - busybox sh
          - bash --posix
    steps:
      - uses: actions/checkout@v7

      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox

      - name: Verify bundle is synchronized with src/
        run: make check-bundle

      - name: Run test suite
        run: make test POSHLI_TEST_SHELL="${{ matrix.shell }}"

      - name: Run test suite against bundle
        run: make test-bundle POSHLI_TEST_SHELL="${{ matrix.shell }}"

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ShellCheck 0.9.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            https://github.com/koalaman/shellcheck/releases/download/v0.9.0/shellcheck-v0.9.0.linux.x86_64.tar.xz
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/shellcheck-v0.9.0/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Check ShellCheck baseline
        run: sh tools/ci/shellcheck.sh

  awk-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        awk:
          - gawk
          - mawk
          - busybox
    steps:
      - uses: actions/checkout@v7

      - name: Install shells and awk implementations
        run: sudo apt-get update && sudo apt-get install -y dash gawk mawk busybox

      - name: Select the awk implementation
        run: |
          mkdir -p "$RUNNER_TEMP/awk-bin"
          case "${{ matrix.awk }}" in
            gawk) ln -s "$(command -v gawk)" "$RUNNER_TEMP/awk-bin/awk" ;;
            mawk) ln -s "$(command -v mawk)" "$RUNNER_TEMP/awk-bin/awk" ;;
            busybox) ln -s "$(command -v busybox)" "$RUNNER_TEMP/awk-bin/awk" ;;
          esac
          echo "$RUNNER_TEMP/awk-bin" >> "$GITHUB_PATH"

      - name: Verify the selected awk
        run: |
          command -v awk
          case "${{ matrix.awk }}" in
            gawk) awk --version 2>&1 | sed -n '1p' | grep -q 'GNU Awk' ;;
            mawk) awk -W version 2>&1 | sed -n '1p' | grep -q 'mawk' ;;
            busybox) test "$(readlink -f "$(command -v awk)")" = "$(readlink -f "$(command -v busybox)")" ;;
          esac

      - name: Verify bundle is synchronized with src/
        run: make check-bundle

      - name: Run test suite (sources)
        run: make test POSHLI_TEST_SHELL=dash

      - name: Run test suite (bundle)
        run: make test-bundle POSHLI_TEST_SHELL=dash

  ksh-mksh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install ksh, mksh and awk implementations
        run: sudo apt-get update && sudo apt-get install -y ksh mksh gawk mawk

      - name: Verify shells and awk implementations
        run: |
          command -v ksh93
          command -v mksh
          ksh93 -c 'echo "$KSH_VERSION"'
          mksh -c 'echo "$KSH_VERSION"'
          gawk --version 2>&1 | sed -n '1p'
          mawk -W version 2>&1 | sed -n '1p'

      - name: Run suite with ksh93 and mksh using GNU awk and mawk
        run: |
          set -e
          for awk_impl in gawk mawk; do
            awk_bin="$RUNNER_TEMP/awk-$awk_impl"
            rm -rf "$awk_bin"
            mkdir -p "$awk_bin"
            ln -s "$(command -v "$awk_impl")" "$awk_bin/awk"
            echo "== awk: $awk_impl =="
            PATH="$awk_bin:$PATH" command -v awk
            case "$awk_impl" in
              gawk) awk_version=$(PATH="$awk_bin:$PATH" awk --version 2>&1) ;;
              mawk) awk_version=$(PATH="$awk_bin:$PATH" awk -W version 2>&1) ;;
              *) printf 'unknown awk implementation: %s\n' "$awk_impl" >&2; exit 1 ;;
            esac
            case "$awk_impl:$awk_version" in
              gawk:*"GNU Awk"*) ;;
              mawk:*mawk*) ;;
              *) printf 'selected awk is not %s\n' "$awk_impl" >&2; exit 1 ;;
            esac
            printf '%s\n' "$awk_version" | sed -n '1p'
            PATH="$awk_bin:$PATH" make check-bundle
            for shell in ksh93 mksh; do
              echo "== shell: $shell, awk: $awk_impl =="
              PATH="$awk_bin:$PATH" make test POSHLI_TEST_SHELL="$shell"
              PATH="$awk_bin:$PATH" make test-bundle POSHLI_TEST_SHELL="$shell"
            done
          done
