name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shell:
          - dash
          - busybox sh
          - bash --posix
    steps:
      - uses: actions/checkout@v7

      - name: Install busybox
        run: sudo apt-get update && sudo apt-get install -y busybox

      - name: Verify bundle is synchronized with src/
        run: make check-bundle

      - name: Run test suite
        run: make test POSHLI_TEST_SHELL="${{ matrix.shell }}"

      - name: Run test suite against bundle
        run: make test-bundle POSHLI_TEST_SHELL="${{ matrix.shell }}"
